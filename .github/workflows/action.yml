name: Action

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: shareguard
        uses: ./
        with:
          fail-on: low
          format: sarif
          output: shareguard.sarif
      - run: node -e "const fs = require('node:fs'); const data = JSON.parse(fs.readFileSync('shareguard.sarif')); if (data.version !== '2.1.0') process.exit(1)"
      - run: test "$SARIF_OUTPUT" = "shareguard.sarif"
        env:
          SARIF_OUTPUT: ${{ steps.shareguard.outputs.sarif }}
